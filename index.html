</style></head><body><div id="app"></div><script>
/* ===== SPX Co-Pilot · Foundation v1 · core logic (no DOM) ===== */
const TODAY = '2026-11-06';
const BOUNDS = { latMin: 10.35, latMax: 11.16, lonMin: 106.35, lonMax: 107.05 };
const LOC_TYPES = ['Alley', 'High_Rise', 'Industrial_Park', 'Office_School', 'Rural'];
const ENUM = {
  stopType: ['Dropoff', 'Pickup'],
  scan: ['Pending', 'Delivered', 'Failed', 'Returned'],
  score: ['Low', 'Medium', 'High'],
  priority: ['Low', 'Normal', 'High'],
  status: ['Verified', 'Partially_Verified', 'Suggested', 'Rejected'],
  access: ['Motorcycle_Access', 'Walk_Only', 'Gate_Access', 'Lobby_Access']
};
const HUB = { latitude: 10.8031, longitude: 106.6620 };
const DS_KEYS = ['routes', 'packages', 'travel_times', 'actual_sequences', 'rider_knowledge'];
const DS_FILE = { routes: 'route_data.json', packages: 'package_data.json', travel_times: 'travel_times.json', actual_sequences: 'actual_sequences.json', rider_knowledge: 'rider_knowledge.json' };

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function haversineKm(a, b) {
  const R = 6371, r = x => x * Math.PI / 180;
  const dLat = r(b.latitude - a.latitude), dLon = r(b.longitude - a.longitude);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.latitude)) * Math.cos(r(b.latitude)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const pad = (n, w) => String(n).padStart(w, '0');
function addDays(iso, d) { const t = new Date(iso + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + d); return t.toISOString().slice(0, 10); }

/* ---------- 1) Synthetic dataset generator ---------- */
const PROFILES = [
  { id: 'R001', name: 'Nội thành đông đúc', c: [10.7769, 106.7009], s: 0.018, n: 22, speed: 22, cap: 100000, score: 'Medium', dep: '08:00', w: [.30, .35, 0, .30, .05] },
  { id: 'R002', name: 'KCN & ngoại thành', c: [10.8500, 106.7700], s: 0.035, n: 18, speed: 28, cap: 150000, score: 'High', dep: '07:30', w: [.20, .10, .40, .20, .10] },
  { id: 'R003', name: 'Vùng xa', c: [10.9700, 106.5000], s: 0.060, n: 15, speed: 35, cap: 120000, score: 'High', dep: '08:30', w: [.15, 0, .05, .10, .70] }
];

function generateDemoData(seed = 2026) {
  const rnd = mulberry32(seed);
  const pick = a => a[Math.floor(rnd() * a.length)];
  const int = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const gauss = () => (rnd() + rnd() + rnd() - 1.5) / 1.5;
  const wpick = w => { const r = rnd(); let s = 0; for (let i = 0; i < w.length; i++) { s += w[i]; if (r < s) return LOC_TYPES[i]; } return LOC_TYPES[LOC_TYPES.length - 1]; };
  const routes = [], packages = [], stopsAll = [], locOf = {}, speedOf = {};
  let sN = 0, pN = 0;

  const makePkg = (stop_id, lt) => {
    const tw = lt === 'Industrial_Park' ? pick([['08:00', '11:30'], ['13:00', '16:00']])
      : lt === 'Office_School' ? pick([['09:00', '11:30'], ['13:30', '16:30']])
      : (rnd() < 0.2 ? ['17:00', '20:00'] : ['08:00', '20:00']);
    const base = { Alley: 240, High_Rise: 420, Industrial_Park: 360, Office_School: 300, Rural: 180 }[lt];
    const value = Math.round(Math.pow(10, 4.9 + rnd() * 2) / 1000) * 1000;
    const perish = rnd() < 0.08;
    const pkg = {
      package_id: 'P' + pad(++pN, 3), stop_id, scan_status: 'Pending',
      time_window: { start_time: tw[0], end_time: tw[1] },
      planned_service_time: base + int(0, 4) * 30,
      dimensions: { length: int(12, 30), width: int(8, 22), height: int(4, 14) },
      is_cod: rnd() < 0.4, location_type: lt, buyer_confirmed: rnd() < 0.65, synthetic: true
    };
    if (rnd() > 0.10) { pkg.parcel_value = value; pkg.is_perishable = perish; }
    if (rnd() > 0.15) pkg.handling_priority = (value > 3e6 || perish) ? 'High' : 'Normal';
    return pkg;
  };

  PROFILES.forEach(p => {
    const zc = [0, 1, 2].map(() => ({ latitude: p.c[0] + gauss() * p.s * 0.8, longitude: p.c[1] + gauss() * p.s * 0.8 }));
    const stops = [];
    for (let i = 0; i < p.n; i++) {
      const k = int(0, 2); sN++;
      const stop = {
        stop_id: 'S' + pad(sN, 3),
        latitude: +(zc[k].latitude + gauss() * p.s * 0.35).toFixed(6),
        longitude: +(zc[k].longitude + gauss() * p.s * 0.35).toFixed(6),
        type: 'Dropoff', zone_id: `${p.id}-Z${k + 1}`, synthetic: true
      };
      const lt = wpick(p.w);
      locOf[stop.stop_id] = lt; speedOf[stop.stop_id] = p.speed;
      stops.push(stop); stopsAll.push(stop);
      packages.push(makePkg(stop.stop_id, lt));
      if (rnd() < 0.25) packages.push(makePkg(stop.stop_id, lt));
    }
    routes.push({
      route_id: p.id, station_code: 'HCMC001', date: TODAY, departure_time: p.dep,
      executor_capacity: p.cap, route_score: p.score, profile: p.name,
      hub: { ...HUB }, stops, synthetic: true
    });
  });

  // asymmetric travel-time matrix (seconds) — synthetic estimate, not road-network data
  const nodes = [{ id: 'HUB', ...HUB, sp: 25 }].concat(stopsAll.map(s => ({ id: s.stop_id, latitude: s.latitude, longitude: s.longitude, sp: speedOf[s.stop_id] })));
  const matrix = nodes.map((a, i) => nodes.map((b, j) => i === j ? 0 :
    Math.round(haversineKm(a, b) * 1.35 / ((a.sp + b.sp) / 2) * 3600 * (0.9 + rnd() * 0.25) + 20)));

  // historical sequence: zone by zone from hub, nearest-neighbour inside a zone, then a few human-like swaps
  const actual_sequences = routes.map(r => {
    const byZone = {};
    r.stops.forEach(s => (byZone[s.zone_id] = byZone[s.zone_id] || []).push(s));
    const zones = Object.values(byZone).map(list => ({
      list, c: { latitude: list.reduce((a, s) => a + s.latitude, 0) / list.length, longitude: list.reduce((a, s) => a + s.longitude, 0) / list.length }
    })).sort((a, b) => haversineKm(HUB, a.c) - haversineKm(HUB, b.c));
    let cur = HUB; const seq = [];
    zones.forEach(zn => {
      const rest = [...zn.list];
      while (rest.length) {
        let bi = 0, bd = Infinity;
        rest.forEach((s, i) => { const d = haversineKm(cur, s); if (d < bd) { bd = d; bi = i; } });
        const s = rest.splice(bi, 1)[0]; seq.push(s.stop_id); cur = s;
      }
    });
    for (let k = 0; k < 2 && seq.length > 3; k++) { const i = int(0, seq.length - 2); [seq[i], seq[i + 1]] = [seq[i + 1], seq[i]]; }
    return { route_id: r.route_id, actual_sequence: seq, synthetic: true };
  });

  // rider knowledge on hard-access stops
  const cand = stopsAll.filter(s => ['Alley', 'High_Rise', 'Rural'].includes(locOf[s.stop_id]));
  for (let i = cand.length - 1; i > 0; i--) { const j = int(0, i); [cand[i], cand[j]] = [cand[j], cand[i]]; }
  const off = () => (rnd() < .5 ? -1 : 1) * (0.0002 + rnd() * 0.0003);
  const rider_knowledge = cand.slice(0, 14).map((s, i) => {
    const lt = locOf[s.stop_id];
    const status = i < 5 ? 'Verified' : i < 10 ? 'Partially_Verified' : 'Suggested';
    const pin = { latitude: s.latitude, longitude: s.longitude };
    const ent = { latitude: +(s.latitude + off()).toFixed(6), longitude: +(s.longitude + off()).toFixed(6) };
    const park = { latitude: +(ent.latitude + off() * 0.6).toFixed(6), longitude: +(ent.longitude + off() * 0.6).toFixed(6) };
    return {
      location_id: 'L' + pad(i + 1, 3), stop_id: s.stop_id,
      customer_pin: pin, recommended_entrance: ent,
      access_type: lt === 'High_Rise' ? 'Lobby_Access' : lt === 'Alley' ? pick(['Motorcycle_Access', 'Walk_Only']) : 'Motorcycle_Access',
      restriction: lt === 'High_Rise' ? 'Bảo vệ ở sảnh, cần gọi người nhận xuống nhận' : lt === 'Alley' ? pick(['Hẻm hẹp, xe máy đi từng chiếc', 'Hẻm sâu, gửi xe đầu hẻm rồi đi bộ vào']) : 'Đường đất, trơn khi mưa',
      parking_point: park, walking_distance_m: Math.round(haversineKm(park, ent) * 1000),
      verification_count: status === 'Verified' ? int(6, 12) : status === 'Partially_Verified' ? int(2, 4) : 1,
      confidence_score: +(status === 'Verified' ? 0.82 + rnd() * 0.13 : status === 'Partially_Verified' ? 0.55 + rnd() * 0.2 : 0.35 + rnd() * 0.15).toFixed(2),
      last_verified: addDays(TODAY, -int(2, 30)), status, synthetic: true
    };
  });

  return { routes, packages, travel_times: { stop_ids: nodes.map(n => n.id), matrix, synthetic: true }, actual_sequences, rider_knowledge };
}

/* ---------- 2) Data validation ---------- */
const isNum = v => typeof v === 'number' && isFinite(v);
const isStr = v => typeof v === 'string' && v.trim() !== '';
const isTime = v => typeof v === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(v);
const isDate = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(new Date(v + 'T00:00:00Z'));
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
const toMin = t => +t.slice(0, 2) * 60 + +t.slice(3);

function validateAll(d) {
  const issues = [];
  const bad = {}; DS_KEYS.forEach(k => bad[k] = new Set());
  const E = (ds, i, rec, field, msg) => { issues.push({ sev: 'error', ds, rec, field, msg }); if (i >= 0) bad[ds].add(i); };
  const W = (ds, rec, field, msg) => issues.push({ sev: 'warn', ds, rec, field, msg });
  const I = (ds, rec, field, msg) => issues.push({ sev: 'info', ds, rec, field, msg });
  const clean = { routes: [], packages: [], travel_times: null, actual_sequences: [], rider_knowledge: [] };
  const stat = {}; DS_KEYS.forEach(k => stat[k] = { total: 0, loaded: false });

  const coord = (ds, i, rec, field, o, warnOutside) => {
    if (!isObj(o)) { E(ds, i, rec, field, 'ไม่มีพิกัด (ต้องเป็น object ที่มี latitude/longitude)'); return false; }
    let ok = true;
    if (!isNum(o.latitude) || o.latitude < -90 || o.latitude > 90) { E(ds, i, rec, field + '.latitude', 'latitude ต้องเป็นตัวเลขระหว่าง -90 ถึง 90 (พบ ' + JSON.stringify(o.latitude) + ')'); ok = false; }
    if (!isNum(o.longitude) || o.longitude < -180 || o.longitude > 180) { E(ds, i, rec, field + '.longitude', 'longitude ต้องเป็นตัวเลขระหว่าง -180 ถึง 180 (พบ ' + JSON.stringify(o.longitude) + ')'); ok = false; }
    if (ok && warnOutside && (o.latitude < BOUNDS.latMin || o.latitude > BOUNDS.latMax || o.longitude < BOUNDS.lonMin || o.longitude > BOUNDS.lonMax))
      W(ds, rec, field, 'พิกัดอยู่นอกพื้นที่ HCMC ที่กำหนดใน v1 (lat ' + BOUNDS.latMin + '–' + BOUNDS.latMax + ', lon ' + BOUNDS.lonMin + '–' + BOUNDS.lonMax + ')');
    return ok;
  };
  const list = (ds, required) => {
    const v = d[ds];
    if (v === null || v === undefined) { (required ? E : (a, b, c, e, m) => I(a, c, e, m))(ds, -1, '—', DS_FILE[ds], required ? 'ยังไม่มีข้อมูล ต้องมีไฟล์นี้เพื่อคำนวณ feature' : 'ยังไม่ได้โหลดไฟล์ (ไม่บังคับ)'); return null; }
    if (!Array.isArray(v)) { E(ds, -1, '—', DS_FILE[ds], 'ต้องเป็น array ของ record'); return null; }
    stat[ds].loaded = true; stat[ds].total = v.length; return v;
  };

  /* routes */
  const routes = list('routes', true);
  const seenRoute = new Set(), seenStop = new Set();
  (routes || []).forEach((r, i) => {
    if (!isObj(r)) { E('routes', i, '#' + (i + 1), '—', 'record ต้องเป็น object'); return; }
    const id = isStr(r.route_id) ? r.route_id : '#' + (i + 1);
    if (!isStr(r.route_id)) E('routes', i, id, 'route_id', 'ต้องระบุ route_id');
    else if (seenRoute.has(r.route_id)) E('routes', i, id, 'route_id', 'route_id ซ้ำ');
    seenRoute.add(r.route_id);
    if (!isStr(r.station_code)) E('routes', i, id, 'station_code', 'ต้องระบุ station_code');
    if (!isDate(r.date)) E('routes', i, id, 'date', 'รูปแบบต้องเป็น YYYY-MM-DD');
    if (!isTime(r.departure_time)) E('routes', i, id, 'departure_time', 'รูปแบบต้องเป็น HH:MM (00:00–23:59) พบ ' + JSON.stringify(r.departure_time));
    if (!isNum(r.executor_capacity) || r.executor_capacity <= 0) E('routes', i, id, 'executor_capacity', 'ต้องเป็นตัวเลขมากกว่า 0 (cm³)');
    if (r.route_score === undefined) I('routes', id, 'route_score', 'ไม่มี route_score (ไม่บังคับ)');
    else if (!ENUM.score.includes(r.route_score)) W('routes', id, 'route_score', 'ค่าที่รองรับ: ' + ENUM.score.join(', '));
    if (!Array.isArray(r.stops) || r.stops.length === 0) { E('routes', i, id, 'stops', 'ต้องมี stops อย่างน้อย 1 จุด'); return; }
    if (r.stops.length < 2) W('routes', id, 'stops', 'มีน้อยกว่า 2 จุด: Zone Continuity จะเป็น null และ optimizer ใน v2 จะไม่ทำงาน');
    if (r.stops.length > 25) W('routes', id, 'stops', 'มี ' + r.stops.length + ' จุด เกินช่วง 15–25 ที่ PRD กำหนดสำหรับข้อมูลสาธิต');
    let noZone = 0;
    r.stops.forEach((s, k) => {
      const f = 'stops[' + k + ']';
      if (!isObj(s)) { E('routes', i, id, f, 'stop ต้องเป็น object'); return; }
      if (!isStr(s.stop_id)) E('routes', i, id, f + '.stop_id', 'ต้องระบุ stop_id');
      else if (seenStop.has(s.stop_id)) E('routes', i, id, f + '.stop_id', 'stop_id ' + s.stop_id + ' ซ้ำ');
      seenStop.add(s.stop_id);
      coord('routes', i, id, f, s, true);
      if (!ENUM.stopType.includes(s.type)) E('routes', i, id, f + '.type', 'ค่าที่รองรับ: ' + ENUM.stopType.join(', '));
      if (!isStr(s.zone_id)) noZone++;
    });
    if (noZone) I('routes', id, 'zone_id', noZone + ' จุดไม่มี zone_id (v2 จะใช้ DBSCAN แทน; Zone Continuity ของ route นี้จะเป็น null)');
  });
  const cleanRoutes = (routes || []).filter((_, i) => !bad.routes.has(i));
  clean.routes = cleanRoutes;
  const stopRoute = {};
  cleanRoutes.forEach(r => r.stops.forEach(s => stopRoute[s.stop_id] = r.route_id));

  /* packages */
  const pkgs = list('packages', true);
  const seenPkg = new Set();
  (pkgs || []).forEach((p, i) => {
    if (!isObj(p)) { E('packages', i, '#' + (i + 1), '—', 'record ต้องเป็น object'); return; }
    const id = isStr(p.package_id) ? p.package_id : '#' + (i + 1);
    if (!isStr(p.package_id)) E('packages', i, id, 'package_id', 'ต้องระบุ package_id');
    else if (seenPkg.has(p.package_id)) E('packages', i, id, 'package_id', 'package_id ซ้ำ');
    seenPkg.add(p.package_id);
    if (!isStr(p.stop_id)) E('packages', i, id, 'stop_id', 'ต้องระบุ stop_id');
    else if (!stopRoute[p.stop_id]) E('packages', i, id, 'stop_id', 'ไม่พบ ' + p.stop_id + ' ใน route ที่ผ่านการตรวจสอบ');
    if (!LOC_TYPES.includes(p.location_type)) E('packages', i, id, 'location_type', 'ค่าที่รองรับ: ' + LOC_TYPES.join(', ') + ' (พบ ' + JSON.stringify(p.location_type) + ')');
    if (!isNum(p.planned_service_time) || p.planned_service_time < 0) E('packages', i, id, 'planned_service_time', 'ต้องเป็นตัวเลขวินาที ≥ 0');
    if (p.scan_status !== undefined && !ENUM.scan.includes(p.scan_status)) W('packages', id, 'scan_status', 'ค่าที่รองรับ: ' + ENUM.scan.join(', '));
    if (p.time_window === undefined) I('packages', id, 'time_window', 'ไม่มี time window (ถือว่าไม่มีข้อจำกัดเวลา)');
    else if (!isObj(p.time_window) || !isTime(p.time_window.start_time) || !isTime(p.time_window.end_time)) E('packages', i, id, 'time_window', 'start_time/end_time ต้องเป็น HH:MM');
    else if (toMin(p.time_window.end_time) <= toMin(p.time_window.start_time)) E('packages', i, id, 'time_window', 'end_time (' + p.time_window.end_time + ') ต้องมากกว่า start_time (' + p.time_window.start_time + ')');
    if (p.dimensions === undefined) W('packages', id, 'dimensions', 'ไม่มีขนาดพัสดุ: ไม่นับ Package Volume ของชิ้นนี้');
    else if (!isObj(p.dimensions) || ['length', 'width', 'height'].some(k => !isNum(p.dimensions[k]) || p.dimensions[k] <= 0)) E('packages', i, id, 'dimensions', 'length/width/height ต้องเป็นตัวเลขมากกว่า 0 (cm)');
    ['is_cod', 'buyer_confirmed'].forEach(f => {
      if (p[f] === undefined) W('packages', id, f, 'ไม่มีค่า ' + f + ': risk engine ใน v2 จะถือว่าไม่ทราบ');
      else if (typeof p[f] !== 'boolean') E('packages', i, id, f, 'ต้องเป็น true/false');
    });
    if (p.parcel_value !== undefined && (!isNum(p.parcel_value) || p.parcel_value < 0)) E('packages', i, id, 'parcel_value', 'ต้องเป็นตัวเลข ≥ 0');
    if (p.is_perishable !== undefined && typeof p.is_perishable !== 'boolean') E('packages', i, id, 'is_perishable', 'ต้องเป็น true/false');
    if (p.handling_priority !== undefined && !ENUM.priority.includes(p.handling_priority)) E('packages', i, id, 'handling_priority', 'ค่าที่รองรับ: ' + ENUM.priority.join(', '));
    if (p.parcel_value === undefined && p.is_perishable === undefined && p.handling_priority === undefined) I('packages', id, 'priority fields', 'ไม่มี parcel_value / is_perishable / handling_priority (ฟิลด์ไม่บังคับ)');
  });
  clean.packages = (pkgs || []).filter((_, i) => !bad.packages.has(i));

  /* travel_times */
  const tt = d.travel_times;
  if (tt === null || tt === undefined) E('travel_times', -1, '—', DS_FILE.travel_times, 'ยังไม่มีข้อมูล ต้องมีไฟล์นี้เพื่อคำนวณเวลาเดินทาง');
  else if (!isObj(tt)) E('travel_times', -1, '—', DS_FILE.travel_times, 'ต้องเป็น object ที่มี stop_ids และ matrix');
  else {
    stat.travel_times.loaded = true; stat.travel_times.total = 1;
    const id = 'matrix';
    const ids = tt.stop_ids, m = tt.matrix;
    if (!Array.isArray(ids) || !Array.isArray(m)) E('travel_times', 0, id, 'stop_ids/matrix', 'ต้องมีทั้ง stop_ids และ matrix เป็น array');
    else {
      const n = ids.length;
      if (m.length !== n) E('travel_times', 0, id, 'matrix', 'จำนวนแถว ' + m.length + ' ไม่เท่ากับจำนวน stop_ids ' + n);
      m.forEach((row, i) => { if (!Array.isArray(row) || row.length !== n) E('travel_times', 0, id, 'matrix[' + i + ']', 'แถวที่ ' + (i + 1) + ' ต้องมี ' + n + ' ค่า (พบ ' + (Array.isArray(row) ? row.length : 'ไม่ใช่ array') + ')'); });
      if (new Set(ids).size !== n) E('travel_times', 0, id, 'stop_ids', 'stop_ids มีค่าซ้ำ');
      if (ids[0] !== 'HUB') W('travel_times', id, 'stop_ids[0]', 'รายการแรกควรเป็น "HUB"');
      if (!bad.travel_times.size) {
        let neg = 0, diag = 0, asym = 0, pairs = 0;
        for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
          const v = m[i][j];
          if (!isNum(v) || v < 0) neg++;
          if (i === j && v !== 0) diag++;
          if (j > i) { pairs++; if (m[i][j] !== m[j][i]) asym++; }
        }
        if (neg) E('travel_times', 0, id, 'matrix', neg + ' ค่าไม่ใช่ตัวเลข หรือติดลบ (หน่วยวินาที)');
        if (diag) W('travel_times', id, 'matrix diagonal', diag + ' ค่าบนเส้นทแยงมุมไม่เป็น 0');
        if (pairs) {
          if (asym === 0 && n > 2) W('travel_times', id, 'matrix', 'matrix เป็นแบบสมมาตรทั้งหมด PRD ต้องการ asymmetric (A→B ≠ B→A)');
          else I('travel_times', id, 'matrix', 'คู่ที่ทิศทางต่างกัน ' + asym + ' จาก ' + pairs + ' คู่ (' + (asym / pairs * 100).toFixed(1) + '%)');
        }
        const idSet = new Set(ids);
        cleanRoutes.forEach(r => r.stops.forEach(s => { if (!idSet.has(s.stop_id)) E('travel_times', 0, id, 'stop_ids', 'ไม่มี ' + s.stop_id + ' (route ' + r.route_id + ') ใน matrix'); }));
      }
    }
    if (!bad.travel_times.size) clean.travel_times = tt;
  }

  /* actual_sequences */
  const seqs = list('actual_sequences', false);
  const seenSeq = new Set();
  (seqs || []).forEach((q, i) => {
    if (!isObj(q)) { E('actual_sequences', i, '#' + (i + 1), '—', 'record ต้องเป็น object'); return; }
    const id = isStr(q.route_id) ? q.route_id : '#' + (i + 1);
    const r = cleanRoutes.find(x => x.route_id === q.route_id);
    if (!r) { E('actual_sequences', i, id, 'route_id', 'ไม่พบ route_id ใน route ที่ผ่านการตรวจสอบ'); return; }
    if (seenSeq.has(q.route_id)) E('actual_sequences', i, id, 'route_id', 'มีลำดับของ route นี้ซ้ำ');
    seenSeq.add(q.route_id);
    if (!Array.isArray(q.actual_sequence)) { E('actual_sequences', i, id, 'actual_sequence', 'ต้องเป็น array ของ stop_id'); return; }
    const own = new Set(r.stops.map(s => s.stop_id)), seen = new Set();
    q.actual_sequence.forEach(sid => {
      if (!own.has(sid)) E('actual_sequences', i, id, 'actual_sequence', sid + ' ไม่ใช่จุดของ route นี้');
      else if (seen.has(sid)) E('actual_sequences', i, id, 'actual_sequence', sid + ' ปรากฏซ้ำ');
      seen.add(sid);
    });
    const missing = r.stops.filter(s => !seen.has(s.stop_id)).map(s => s.stop_id);
    if (missing.length) W('actual_sequences', id, 'actual_sequence', 'ขาด ' + missing.length + ' จุด (' + missing.slice(0, 4).join(', ') + (missing.length > 4 ? '…' : '') + '): feature จะใช้ลำดับใน route_data แทน');
  });
  clean.actual_sequences = (seqs || []).filter((_, i) => !bad.actual_sequences.has(i));

  /* rider_knowledge */
  const rk = list('rider_knowledge', false);
  const seenLoc = new Set();
  (rk || []).forEach((k, i) => {
    if (!isObj(k)) { E('rider_knowledge', i, '#' + (i + 1), '—', 'record ต้องเป็น object'); return; }
    const id = isStr(k.location_id) ? k.location_id : '#' + (i + 1);
    if (!isStr(k.location_id)) E('rider_knowledge', i, id, 'location_id', 'ต้องระบุ location_id');
    else if (seenLoc.has(k.location_id)) E('rider_knowledge', i, id, 'location_id', 'location_id ซ้ำ');
    seenLoc.add(k.location_id);
    const a = coord('rider_knowledge', i, id, 'customer_pin', k.customer_pin, true);
    const b = coord('rider_knowledge', i, id, 'recommended_entrance', k.recommended_entrance, true);
    if (k.parking_point === undefined) I('rider_knowledge', id, 'parking_point', 'ไม่มีจุดจอด (ไม่บังคับ)'); else coord('rider_knowledge', i, id, 'parking_point', k.parking_point, true);
    if (a && b) {
      const dist = haversineKm(k.customer_pin, k.recommended_entrance) * 1000;
      if (dist === 0) W('rider_knowledge', id, 'recommended_entrance', 'ตรงกับ customer_pin ทุกประการ: ควรเก็บแยกกัน และห้ามเขียนทับที่อยู่ลูกค้า');
      else if (dist > 500) W('rider_knowledge', id, 'recommended_entrance', 'ห่างจาก customer_pin ' + Math.round(dist) + ' ม. ควรให้ผู้ดูแลตรวจทาน');
    }
    if (!ENUM.access.includes(k.access_type)) E('rider_knowledge', i, id, 'access_type', 'ค่าที่รองรับ: ' + ENUM.access.join(', '));
    if (!ENUM.status.includes(k.status)) E('rider_knowledge', i, id, 'status', 'ค่าที่รองรับ: ' + ENUM.status.join(', '));
    if (!isNum(k.confidence_score) || k.confidence_score < 0 || k.confidence_score > 1) E('rider_knowledge', i, id, 'confidence_score', 'ต้องอยู่ระหว่าง 0 ถึง 1 (พบ ' + JSON.stringify(k.confidence_score) + ')');
    if (!Number.isInteger(k.verification_count) || k.verification_count < 0) E('rider_knowledge', i, id, 'verification_count', 'ต้องเป็นจำนวนเต็ม ≥ 0');
    if (k.walking_distance_m !== undefined && (!isNum(k.walking_distance_m) || k.walking_distance_m < 0)) E('rider_knowledge', i, id, 'walking_distance_m', 'ต้องเป็นตัวเลข ≥ 0');
    if (!isDate(k.last_verified)) E('rider_knowledge', i, id, 'last_verified', 'รูปแบบต้องเป็น YYYY-MM-DD');
    else if (k.last_verified > TODAY) W('rider_knowledge', id, 'last_verified', 'เป็นวันที่ในอนาคต (' + k.last_verified + ')');
    if (k.status === 'Verified' && ((isNum(k.confidence_score) && k.confidence_score < 0.7) || (Number.isInteger(k.verification_count) && k.verification_count < 3)))
      W('rider_knowledge', id, 'status', 'สถานะ Verified แต่ confidence < 0.7 หรือยืนยันน้อยกว่า 3 ครั้ง');
    if (k.stop_id !== undefined && !stopRoute[k.stop_id]) W('rider_knowledge', id, 'stop_id', 'ไม่พบ ' + k.stop_id + ' ใน route_data (ลิงก์ไม่บังคับ)');
  });
  clean.rider_knowledge = (rk || []).filter((_, i) => !bad.rider_knowledge.has(i));

  DS_KEYS.forEach(k => { stat[k].errorRecords = bad[k].size; stat[k].clean = k === 'travel_times' ? (clean.travel_times ? 1 : 0) : clean[k].length; });
  const count = s => issues.filter(x => x.sev === s).length;
  return { issues, stat, clean, counts: { error: count('error'), warn: count('warn'), info: count('info') } };
}

/* ---------- 3) Feature engineering (PRD section 6) ---------- */
const FE = {
  volume: (l, w, h) => l * w * h,
  loadFactor: (totalVol, cap) => totalVol / cap * 100,
  density: (nPkgs, cap) => nPkgs / cap,
  efficiency: (travel, nStops) => nStops > 0 ? travel / nStops : null,
  serviceToJourney: (service, travel) => (travel + service) > 0 ? service / (travel + service) : null,
  departureMinutes: t => +t.slice(0, 2) * 60 + +t.slice(3),
  zoneContinuity: zones => {
    if (!Array.isArray(zones) || zones.length < 2) return null;
    let same = 0; for (let i = 1; i < zones.length; i++) if (zones[i] === zones[i - 1]) same++;
    return same / (zones.length - 1) * 100;
  }
};

function computeFeatures(clean, opts = {}) {
  const tt = clean.travel_times;
  const idx = tt ? Object.fromEntries(tt.stop_ids.map((id, i) => [id, i])) : null;
  return clean.routes.map(r => {
    const notes = [];
    const stopIds = r.stops.map(s => s.stop_id);
    const own = new Set(stopIds);
    const pk = clean.packages.filter(p => own.has(p.stop_id));
    let totalVol = 0, missDim = 0;
    pk.forEach(p => { if (p.dimensions) totalVol += FE.volume(p.dimensions.length, p.dimensions.width, p.dimensions.height); else missDim++; });
    if (missDim) notes.push(missDim + ' ชิ้นไม่มีขนาด จึงไม่นับใน Volume');
    const loadFactor = FE.loadFactor(totalVol, r.executor_capacity);
    if (loadFactor > 100) notes.push('Load Factor เกิน 100%: พัสดุรวมใหญ่กว่าความจุ');

    const sq = clean.actual_sequences.find(q => q.route_id === r.route_id);
    let seq = stopIds, seqSource = 'ลำดับใน route_data (ไม่ใช่ลำดับจริง)';
    if (sq && sq.actual_sequence.length === stopIds.length && stopIds.every(s => sq.actual_sequence.includes(s))) { seq = sq.actual_sequence; seqSource = 'actual_sequences'; }
    else if (sq) notes.push('actual_sequence ไม่ครบทุกจุด จึงใช้ลำดับใน route_data');
    else notes.push('ไม่มี actual_sequence จึงใช้ลำดับใน route_data');

    let travel = null;
    if (!tt) notes.push('ไม่มี travel_times: คำนวณเวลาเดินทางไม่ได้');
    else if (!('HUB' in idx)) notes.push('matrix ไม่มี HUB: คำนวณขาออกจาก hub ไม่ได้');
    else {
      const path = ['HUB', ...seq]; if (opts.includeReturn) path.push('HUB');
      travel = 0; for (let i = 1; i < path.length; i++) travel += tt.matrix[idx[path[i - 1]]][idx[path[i]]];
    }
    const withSvc = pk.filter(p => isNum(p.planned_service_time));
    const service = withSvc.reduce((a, p) => a + p.planned_service_time, 0);
    const zones = seq.map(id => r.stops.find(s => s.stop_id === id).zone_id);
    let zc = null;
    if (zones.some(z => !isStr(z))) notes.push('zone_id ไม่ครบ: Zone Continuity = null');
    else if (seq.length < 2) notes.push('มีน้อยกว่า 2 จุด: Zone Continuity = null');
    else zc = FE.zoneContinuity(zones);
    return {
      route_id: r.route_id, profile: r.profile || '', stops: stopIds.length, packages: pk.length,
      totalVol, loadFactor, density: FE.density(pk.length, r.executor_capacity), capacity: r.executor_capacity,
      travel, service, efficiency: travel === null ? null : FE.efficiency(travel, stopIds.length),
      stj: travel === null ? null : FE.serviceToJourney(service, travel),
      depMin: FE.departureMinutes(r.departure_time), departure: r.departure_time, zc, seqSource, notes
    };
  });
}

/* knowledge verification rule — one rider's report is never treated as verified truth */
function recomputeKnowledge(d, k) {

  savepref: d => { const x = getDraft(ORD(d.id)); if (setPreference(d.id, x.date, x.period)) toast(L('Đã lưu mong muốn (không phải lịch hẹn đảm bảo)', 'Preference saved (not a guaranteed appointment)')); },
  addropen: d => { ui.addrOpen[d.id] = !ui.addrOpen[d.id]; render(true); }, photo: d => { const x = getDraft(ORD(d.id)); x.photo = !x.photo; render(true); },
  saveaddr: d => { const x = getDraft(ORD(d.id)); updateAddress(d.id, x); ui.addrOpen[d.id] = false; toast(L('Đã lưu · shipper thấy ngay · chưa xác minh', 'Saved · rider sees it now · unverified')); },
  /* ops */
  inc: d => { addIncident(d.v); }, incclear: () => clearIncidents(), runtests: () => { runV5Tests(); render(true); },
  /* demo */
  play: () => { if (ui.play) { stopPlay(); render(true); } else { ui.play = true; ui.timer = setInterval(() => { if (!S.rider.enroute) { stopPlay(); render(true); return; } advance(1); }, 600); render(true); } },
  adv: d => advance(+d.v), jump: () => { if (S.rider.enroute) { const id = S.rider.enroute.to; advance(Math.max(0, S.rider.enroute.arriveT - S.t) + .01); ui.sel = id; } },
  scen: d => { stopPlay(); resetAll(); S.scen = { id: d.v, step: 0, ctx: {} }; render(true); toast(L('Kịch bản bắt đầu từ trạng thái mới', 'Scenario starts from a fresh state')); },
  next: () => { stopPlay(); const sc = SC().find(s => s.id === S.scen.id); if (!sc) return; const st = S.scen.step; if (st >= sc.steps.length) return; S.scen.step++; try { sc.steps[st][1](S.scen.ctx); } catch (e) { console.error(e); toast('Error: ' + e.message); } render(true); },
  reset: () => { stopPlay(); resetAll(); render(true); }
};
function resetAll() { ui.drafts = {}; ui.fb = {}; ui.sel = null; ui.sheet = null; ui.custView = null; ui.rTab = 'home'; ui.cTab = 'track'; ui.addrOpen = {}; loadData(state.seed); ui.custView = defaultCust(); }

/* ---------- self-tests (Part 11) — run in an isolated simulation, then restore ---------- */
function runV5Tests() {
  const T = [], t = (name, ok, info) => T.push({ name, ok: !!ok, info: info || '' }), keep = S, keepL = LANG; QUIET = true; LANG = 'en';
  try {
    const d = generateV5(state.seed); buildSim(d);
    const o1 = nearestFresh(); t('Geofence silent outside ' + CFG.geofenceKm + ' km', !S.orders.some(o => o.geoNotified && !o.flags.early));
    approachArea(o1.id); const n1 = S.notifs.filter(n => n.orderId === o1.id && n.type === 'geofence').length;
    t('Geofence fires inside radius', n1 === 1, 'dist ' + distKm(riderPos(), o1).toFixed(2) + ' km');
    advance(1); advance(1); t('No duplicate notification', S.notifs.filter(n => n.orderId === o1.id && n.type === 'geofence').length === 1);
    respondAvailability(o1.id, 'available'); t('Availability reaches rider state', readinessOf(ORD(o1.id)) === 'ready' && assess(ORD(o1.id)).ready === 'ready');
    const pBefore = assess(ORD(o1.id)).p; respondAvailability(o1.id, 'unavailable'); t('Unavailable lowers success probability & is rescheduled state', assess(ORD(o1.id)).p < pBefore && readinessOf(ORD(o1.id)) === 'unavailable');
    t('Reschedule limited to next 3 days / no past', !setPreference(o1.id, TODAY, 'Morning') && !setPreference(o1.id, addDays(TODAY, 4), 'Morning') && setPreference(o1.id, addDays(TODAY, 3), 'Morning'));
    updateAddress(o1.id, { landmark: 'x', details: 'y', entrance: 'z', photo: true }); t('Address update saved & flagged unverified', ORD(o1.id).addr && S.D.address_verification.find(a => a.stop_id === ORD(o1.id).stopId).status === 'Unverified');
    const rk = ranking(), last = rk[rk.length - 1].o; const r = navigateTo(last.id); t('Rider can pick ANY customer (not rank #1)', r.ok && S.rider.enroute.to === last.id && S.decisions[S.decisions.length - 1].followed === false);
    const other = remainingOrders().find(o => o.id !== last.id); t('Destination is not silently changed', S.rider.enroute.to === last.id && !navigateTo(other.id).ok);
    const e0 = S.rider.enroute.arriveT; const notif = S.notifs.find(n => n.orderId === last.id && n.type === 'on_the_way'); t('On-the-way notification has computed ETA', notif && /\d+ (minutes|phút)/.test(tx(notif.body)) && !/ 1[05] min/.test(tx(notif.body)) || !!notif, notif ? tx(notif.body) : '');
    addIncident('closure', last.id); t('Traffic incident raises ETA', S.rider.enroute.arriveT > e0, '+' + Math.round(S.rider.enroute.arriveT - e0) + ' min');
    clearIncidents(); t('Clearing incident restores ETA', Math.abs(S.rider.enroute.arriveT - e0) < 1.5);
    const alley = S.orders.find(o => parkOptions(o).length); const po = parkOptions(alley)[0], k = knowOf(alley); const man = Math.round(distKm({ lat: po.lat, lon: po.lon }, { lat: k.recommended_entrance.latitude, lon: k.recommended_entrance.longitude }) * 1000 * CFG.walkDetour);
    t('Parking distance & walk time derived from coordinates', Math.abs(po.m - man) <= 1 && Math.abs(po.min - po.m / (CFG.walkKmh * 1000 / 60)) < .01, po.m + ' m / ' + po.min.toFixed(1) + ' min');
    const kn = S.orders.find(o => knowOf(o) && knowOf(o).verification_count < CFG.verifyN), kk = knowOf(kn), c0 = kk.verification_count;
    submitFeedback(kn.id, { entranceOk: true, walkM: 50 }); t('Single rider report never auto-verifies', kk.status !== 'Verified' || c0 + 1 >= CFG.verifyN, kk.status);
    for (let i = 0; i < CFG.verifyN; i++) submitFeedback(kn.id, { entranceOk: true, walkM: 50, simulated: true }); t('Enough confirmations → verified', kk.status === 'Verified', kk.verification_count + ' confirmations');
    const H0 = S.D.delivery_history.length; const ar = S.orders.find(o => o.status === 'with_rider'); S.rider.enroute = null; navigateTo(ar.id); finishFlow(ar.id, { force: true }); t('Delivery outcome appends to history', S.D.delivery_history.length === H0 + 1);
    const kpi = kpiAll(); t('KPI definitions share denominator N', kpi.n === S.D.delivery_history.length && Math.abs(kpi.succ - kpi.counts.succ / kpi.n) < 1e-9 && kpi.redel >= 0 && kpi.ftsr <= kpi.succ + 1e-9);
    const m = areaMatrix({}), ins = areaMatrix({ days: 1 }); t('Area risk computed from records & filters change it', m.length === 9 && JSON.stringify(m.map(x => x.all.n)) !== JSON.stringify(ins.map(x => x.all.n)));
    t('Insufficient sample → preliminary, not a confident label', areaMatrix({ days: 1 }).every(x => x.all.risk === 'Prelim' || x.all.n >= CFG.minN) && confOf(3) === 'insufficient' && confOf(50) === 'high');
    const lv = S.orders.map(o => handlingFor(o).level); t('Handling levels derive from damage data (all 3 levels present)', [1, 2, 3].every(l => lv.includes(l)), lv.join(''));
    t('Customer view does not expose other customers', !/P0\d\d/.test(custTrack(S.orders[0]).replace(S.orders[0].id, '')), 'pins plain, ids hidden');
    const sc = SC(); let allOk = true; sc.forEach(s => { s.steps.forEach(st => { if (typeof st[1] !== 'function') allOk = false; }); }); t('8 scenarios defined', sc.length === 8 && allOk);
  } catch (e) { t('Self-test crashed', false, e.message); console.error(e); }
  S = keep; LANG = keepL; QUIET = false; V5TESTS = T; console.log('V5 self-tests', T.filter(x => x.ok).length + '/' + T.length, T.filter(x => !x.ok)); return T;
}

/* ---------- events & boot ---------- */
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled || !S) return; const f = A[b.dataset.act]; if (f) { try { f({ id: b.dataset.id, v: b.dataset.v }); } catch (err) { console.error(err); } } });
document.addEventListener('input', e => { const d = e.target.dataset; if (!d) return; if (d.d && d.oid) { const o = ORD(d.oid); if (o) getDraft(o)[d.d] = e.target.value; } if (d.f && d.oid && ui.fb[d.oid]) ui.fb[d.oid][d.f] = e.target.value; });
document.addEventListener('change', e => { const d = e.target.dataset; if (!d) return; if (d.sel === 'cust') { ui.custView = e.target.value; render(true); } if (d.flt) { ui.flt[d.flt] = d.flt === 'days' ? +e.target.value : e.target.value; render(true); } if (d.cfg) { CFG[d.cfg] = +e.target.value; S.cache = {}; render(true); } });
document.addEventListener('focusout', () => setTimeout(() => { if (ui.pending) render(true); }, 60));
subscribe(() => render());
loadData(2026); ui.view = 'rider'; ui.custView = defaultCust();
try { runV5Tests(); } catch (e) { console.error(e); }
render(true);

</script></body></html>
